# Build and run settings for a service created with "Use a configuration
# file". The scripted deploy (deploy/aws/03-create-service.sh) configures its
# service through the API and does not read this file. A service that does
# read it reads only this file, and App Runner then ignores the environment
# variables set on the service, so AWS_REGION, S3_BUCKET, DYNAMODB_TABLE and
# S3_SIGNER_ROLE_ARN have to be added under run.env, or under run.secrets
# from Parameter Store (the instance role then needs ssm:GetParameters on
# those parameters, which <APP_NAME>-app does not grant). Set the bucket's
# CORS rule with deploy/aws/set-bucket-cors.sh once the service URL is
# known. See deploy/aws/README.md.
version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npm run build
      - npm prune --omit=dev
run:
  runtime-version: 22.21.1
  command: npm start
  network:
    port: 8080
  env:
    - name: NODE_ENV
      value: production
