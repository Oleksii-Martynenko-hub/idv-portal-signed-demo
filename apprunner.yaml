# Build and run settings for App Runner's configuration-file mode.
# Deployment-specific variables (AWS_REGION, S3_BUCKET, DYNAMODB_TABLE) are
# set on the service, not here. See deploy/aws/README.md.
version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npm run build
      - npm prune --omit=dev
run:
  runtime-version: 22.21.1
  command: npm start
  network:
    port: 8080
  env:
    - name: NODE_ENV
      value: production
